name: "Custom Fork: Build & Push Docker Image"
on:
  push:
    branches:
      - custom

env:
  CROSS_TAGLIB_VERSION: "2.1.1-2"
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/download-taglib
        with:
          version: ${{ env.CROSS_TAGLIB_VERSION }}
      - run: go mod download
      - run: go test -shuffle=on -tags netgo -race ./...

  test-js:
    name: Test JS
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
      - run: cd ui && npm ci
      - run: cd ui && npm test
      - run: cd ui && npm run build

  build-and-push:
    name: Build & Push Docker Image
    needs: [test-go, test-js]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version info
        id: version
        run: |
          GIT_TAG=$(git tag --sort=-committerdate | head -n 1)
          GIT_SHA=$(git rev-parse --short HEAD)
          echo "git_tag=${GIT_TAG}-custom" >> $GITHUB_OUTPUT
          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=custom-latest
            type=raw,value=custom-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.version.outputs.git_sha }}
            GIT_TAG=${{ steps.version.outputs.git_tag }}
            CROSS_TAGLIB_VERSION=${{ env.CROSS_TAGLIB_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
